[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sniff-sync"
version = "0.1.0"
description = "One Unix-time trigger for breathing, Pupil Core, and Emotiv EEG on a single computer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyzmq>=25",
    "msgpack>=1.0",
    "pyqtgraph>=0.13",
    "PySide6>=6.5",
    "numpy>=1.22",
    "scipy>=1.9",
]

[project.optional-dependencies]
analysis = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.5",
]

[project.scripts]
sniff-sync = "sniff_sync.__main__:main"
sniff-sync-check = "sniff_sync.check:main"

[tool.setuptools.packages.find]
include = ["sniff_sync*"]
